# Bloodhound Revival — local-only database bootstrap.
# Do not expose this port beyond localhost. The original schema needs review
# before initialization because it includes historical credentials and
# partitions that end in November 2018.
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Copy .env.example to .env and set a local password}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-bloodhound}
      MARIADB_USER: ${MARIADB_USER:-bloodhound_app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MARIADB_HOST_PORT:-3307}:3306"
    volumes:
      - bloodhound-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Optional Phase 1 transport/processing toolchain. It starts idle and does
  # not connect to collectors or alter data until an explicit command is run.
  bh-ingest:
    profiles: ["ingest"]
    build:
      context: .
      dockerfile: docker/ingest/Dockerfile
    image: bloodhound-ingest:local
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MARIADB_DATABASE:-bloodhound}
      DB_USER: ${MARIADB_USER:-bloodhound_app}
      DB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env}
    volumes:
      - ./BHMM/CONF:/etc/bloodhound/bhmm:ro
      - ./tools:/opt/bloodhound/tools:ro
      - ./secrets/bhmm-ssh:/run/ssh:ro
      - ./runtime/bhmm/inbound:/data/inbound
      - ./runtime/bhmm/processing:/data/processing
      - ./runtime/bhmm/processed:/data/processed
      - ./runtime/bhmm/archive:/data/archive
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  bloodhound-db:
